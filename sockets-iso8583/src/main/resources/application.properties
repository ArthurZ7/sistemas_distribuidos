# Aplicação de console: sem servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Modo de execução: "servidor" (sobe os 2 servidores) ou "cliente" (roda os testes)
app.modo=servidor

# Portas dos servidores
servidor.multithread.porta=8080
servidor.nio.porta=8081

# Host usado pelo cliente
cliente.host=localhost
